    <!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taco Palace</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

    <header class="nav">
        <div class="logo">
            <img src="static/images/read_book_study_icon-icons.com_51077.png" alt="Logo Taco Palace" class="imagenlogo">
            <h1><span class="Taco">Taco</span>Palace</h1>
        </div>

        <div class="top-der">
            <div class="f-login">
                <input type="text" id="email" placeholder="Email">
                <button type="button" id="btn-login" class="btn-log">Ingresar</button>
            </div>
            <div class="carro">
                <img src="static/images/book_87705.png" alt="Carrito de compras" class="imagencarrito">
                <div class="texto-carro">
                <h1 class="Libros">Libros</h1>
                <h1 class="Selection">seleccionados: 0</h1>
                </div>
            </div>
        </div>
    </header>

    <nav class="catbarra">
        <div class="categoriascomida">
            <img src="static/images/book_icon_158035.png" alt="Categoría Enchiladas" class="img-cat">
            <p>Enchiladas</p>
        </div>
        <div class="categoriascomida">
            <img src="static/images/science_flask_icon_194854.png" alt="Categoría Tacos" class="imagencat">
            <p>Tacos</p>
        </div>
        <div class="categoriascomida">
            <img src="static/images/temple-2_47888 (1).png" alt="Categoría Flautas" class="imagencat">
            <p>Flautas</p>
        </div>
        <div class="categoriascomida">
            <img src="static/images/laptop_5642 (1).png" alt="Categoría Gorditas" class="imagencat">
            <p>Gorditas</p>
        </div>
        <div class="categoriascomida">
            <img src="static/images/art-palette_102813 (1).png" alt="Categoría Tostadas" class="imagencat">
            <p>Tostadas</p>
        </div>
        <div class="categoriascomida">
            <img src="static/images/279809_teddy-bear-icon.png" alt="Categoría Enfrijoladas" class="imagencat">
            <p>Enfrijoladas</p>
        </div>
    </nav>

    <main class="main">

        <section class="seccionplatillos">
    <div class="texto">
        <h2>Descubre nuevas historias</h2>
        <p>Contamos con <strong>servicio a domicilio</strong></p>
    </div>
    <div class="contenedor-imagen">
        <img id="imagencomida" src="static/images/comida-mexicana.jpg" alt="PlatoMexico">
    </div>
</section>

        <aside class="recomendaciones">
            <h3>Recomendados:</h3>

            <div class="card">
                <img src="static/images/orden-tacos.jpg" alt="Orden de Tacos Recomendada" class="imagenorden">
                <div class="info-card">
                    <span>Orden de Tacos</span>
                    <button type="button" class="botom">+</button>
                </div>
                <a href="#">Ver Más...</a>
            </div>

            <div class="card">
                <img src="static/images/orden-flautas.jpg" alt="Orden de Flautas Recomendada" class="imagenorden">
                <div class="info-card">
                    <span>Orden de Flautas</span>
                    <button type="button" class="botom">+</button>
                </div>
                <a href="#">Ver Más...</a>
            </div>
        </aside>

    </main>

    <script src="static/script.js"></script>
</body>

</html>
